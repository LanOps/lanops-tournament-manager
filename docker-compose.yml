services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lanops_tournament
      POSTGRES_USER: lanops
      POSTGRES_PASSWORD: lanops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanops"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://lanops:${POSTGRES_PASSWORD:-lanops}@postgres:5432/lanops_tournament?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
