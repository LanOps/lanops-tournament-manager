services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thournament
      POSTGRES_USER: thournament
      POSTGRES_PASSWORD: thournament
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thournament"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://thournament:${POSTGRES_PASSWORD:-thournament}@postgres:5432/thournament?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
