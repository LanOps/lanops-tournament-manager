{{define "admin_tournament_new.html"}}
{{template "base" .}}
{{end}}

{{define "content"}}
<h1>New Tournament</h1>
<form method="POST" action="/admin/tournaments" class="form">
    <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required maxlength="100">
    </div>

    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label for="format">Format</label>
        <select id="format" name="format" required>
            <option value="single_elimination">Single Elimination</option>
            <option value="double_elimination">Double Elimination</option>
            <option value="round_robin">Round Robin</option>
        </select>
    </div>

    <div class="form-group">
        <label for="team_size">Team Size (1 = solo)</label>
        <input type="number" id="team_size" name="team_size" value="1" min="1" max="10">
    </div>

    <div class="form-group">
        <label for="max_participants">Max Participants (max {{.MaxParticipants}})</label>
        <input type="number" id="max_participants" name="max_participants"
               value="{{.MaxParticipants}}" min="2" max="256">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Tournament</button>
        <a href="/admin" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{{end}}
