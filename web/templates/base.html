{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Thournaments — LanOps{{end}}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#fdb828">
    <link rel="icon" type="image/png" href="/static/img/lanops.png">
    <link rel="apple-touch-icon" href="/static/img/lanops.png">
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <link rel="stylesheet" href="/static/css/main.css?v={{.AssetVersion}}">
    <meta name="htmx-config" content='{"defaultSwapStyle":"outerHTML"}'>
    <meta name="csrf-token" content="{{.CSRFToken}}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/img/lanops.png" alt="LanOps" class="brand-logo">
            <span class="brand-name">Thournaments</span>
        </a>
        <div class="navbar-links">
            <a href="/tournaments">Tournaments</a>
            {{if .UserID}}
                {{if .IsAdmin}}<a href="/admin">Admin</a>{{end}}
                <a href="/auth/logout" hx-post="/auth/logout" hx-target="body">Logout</a>
            {{else}}
                <a href="/auth/discord">Login with Discord</a>
            {{end}}
        </div>
    </nav>
    <main class="container">
        {{block "content" .}}{{end}}
    </main>
    <script src="/static/js/bracket.js?v={{.AssetVersion}}"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js').catch(function (e) {
            console.warn('SW registration failed:', e);
          });
        });
      }
    </script>
</body>
</html>
{{end}}
