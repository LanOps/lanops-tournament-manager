name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Discord Webhook Action - Lint Start
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Lint Started!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest
          install-mode: goinstall

      - name: Discord Webhook Action - Lint Success
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Lint Success!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - name: Discord Webhook Action - Lint Failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Lint Failure!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanops
          POSTGRES_PASSWORD: lanops
          POSTGRES_DB: lanops_tournament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lanops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Discord Webhook Action - Test Start
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Test Started!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race ./...
        env:
          TEST_DATABASE_URL: "postgres://lanops:lanops@localhost:5432/lanops_tournament_test?sslmode=disable"

      - name: Discord Webhook Action - Test Success
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Test Success!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - name: Discord Webhook Action - Test Failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Test Failure!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Discord Webhook Action - Build Start
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Build Started!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            th0rn0/lanops-tournament-manager:latest
            th0rn0/lanops-tournament-manager:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Discord Webhook Action - Build Success
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Build Success!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - name: Discord Webhook Action - Build Failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Build Failure!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-push]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lanops
          POSTGRES_PASSWORD: smoketest
          POSTGRES_DB: lanops_tournament
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lanops"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Discord Webhook Action - Smoke Test Start
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Smoke Test Started!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - name: Pull image
        run: docker pull th0rn0/lanops-tournament-manager:latest

      - name: Start container
        run: |
          docker run -d \
            --name lanops-tm-smoke \
            --network host \
            -e DATABASE_URL="postgres://lanops:smoketest@localhost:5432/lanops_tournament?sslmode=disable" \
            -e DISCORD_CLIENT_ID=smoke-client-id \
            -e DISCORD_CLIENT_SECRET=smoke-client-secret \
            -e DISCORD_REDIRECT_URL=http://localhost:8080/auth/callback \
            -e DISCORD_BOT_TOKEN=smoke-bot-token \
            -e DISCORD_ADMIN_ROLE_ID=123456789012345678 \
            -e DISCORD_GUILD_ID=123456789012345678 \
            -e SESSION_SECRET=lanops-tm-smoke-test-session-secret-32b \
            -e CSRF_AUTH_KEY=lanops-tm-smoke-test-csrf-auth-key-32b \
            th0rn0/lanops-tournament-manager:latest

      - name: Wait for HTTP 200
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/tournaments > /dev/null; then
              echo "Server is up (attempt $i)"
              exit 0
            fi
            echo "Waiting for server... ($i/20)"
            sleep 1
          done
          echo "Server did not respond after 20s"
          docker logs lanops-tm-smoke
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker stop lanops-tm-smoke 2>/dev/null || true
          docker rm lanops-tm-smoke 2>/dev/null || true

      - name: Discord Webhook Action - Smoke Test Success
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Smoke Test Success!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

      - name: Discord Webhook Action - Smoke Test Failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - ${{ github.head_ref || github.ref_name }} - Smoke Test Failure!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          embed-description: ${{ github.event.head_commit.message }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Extract changelog for this release
        run: |
          awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md

      - name: Discord Webhook Action - Release
        if: env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@86dc739f3f165f16dadc5666051c367efa1692f4 # v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          embed-title: ${{ github.repository }} - v${{ steps.version.outputs.version }} Released!
          embed-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}
          embed-description: Docker image pushed and GitHub release created.
